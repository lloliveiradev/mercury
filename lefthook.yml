# lefthook: git hooks runner (https://github.com/evilmartians/lefthook)
#
# Install:  make install-hooks   (or: lefthook install)
# Bypass:   git commit --no-verify   (ONLY in a justified emergency)
#
# Python (ruff) and SQL hooks are added in phase 01, when the toolchain is pinned.
pre-commit:
  parallel: true
  commands:
    author:
      # The author address becomes public history. Never fall back to a global address.
      run: |
        if ! git config --local user.email >/dev/null 2>&1; then
          echo "✗ no repository-local author. Run: git config user.email <an address you accept to publish>" >&2
          exit 1
        fi
    prettier:
      glob: '*.{ts,tsx,js,jsx,json,yml,yaml,md,css}'
      run: |
        if ! command -v npx >/dev/null 2>&1; then
          echo "⚠ npx is not installed; skipping prettier. Install Node.js." >&2
          exit 0
        fi
        npx --yes prettier --write {staged_files}
        git add {staged_files}
    gitleaks:
      # Credentials in git history are expensive to undo: install gitleaks.
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "⚠ gitleaks is not installed; skipping. Install: brew install gitleaks" >&2
          exit 0
        fi
        gitleaks protect --staged --redact --verbose
commit-msg:
  commands:
    # Lightweight Conventional Commits: "type(scope): subject" or "type: subject"
    conventional:
      run: |
        msg=$(head -n1 "{1}")
        case "$msg" in
          "Merge "*|"Revert "*|"#"*) exit 0 ;;
        esac
        if ! echo "$msg" | grep -qE '^(feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)(\([a-z0-9_-]+\))?!?: .{3,}'; then
          echo "✗ commit message does not follow Conventional Commits."
          echo "  Expected: type(scope): subject   (type ∈ feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)"
          echo "  Received: $msg"
          exit 1
        fi
